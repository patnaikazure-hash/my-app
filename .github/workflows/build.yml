name: Build SAM Panel APK

on:
  push:
    branches: [main, master, sam-android]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'magisk-module/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Build Debug APK
        run: gradle wrapper --gradle-version=8.9 && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Panel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Package Magisk Keep-Alive module
        run: |
          cd magisk-module
          zip -r ../SAM-Panel-KeepAlive.zip . -x "README.md"
          cd ..
          ls -la SAM-Panel-KeepAlive.zip

      - name: Upload Magisk module (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SAM-Panel-KeepAlive-magisk
          path: SAM-Panel-KeepAlive.zip
          retention-days: 90

      - name: Create / update Release with APK + Magisk module
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sam-android-latest
          name: SAM Panel APK (latest build)
          body: |
            ## SAM Panel — latest build from `sam-android`

            **Two files below.** Install both for maximum uptime.

            - `app-debug.apk` — the panel app itself. Install directly; it signs
              in-place over the previous version so you never have to uninstall.
            - `SAM-Panel-KeepAlive.zip` — optional Magisk module. Flash via
              Magisk Manager → Modules → Install from storage, then reboot.
              Adds persistent system-level allowlist, disables the Android 14+
              cached-apps freezer, and pins every WebView renderer PID so the
              OS cannot kill them.

            The APK alone works without the Magisk module, but the module is
            the strongest defense against system-side kills on modern Android.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            SAM-Panel-KeepAlive.zip
          prerelease: false
          make_latest: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
